# Pull requests are not accepted in this repository.
# GitHub has no setting to turn them off, so this workflow closes them.
name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "Thanks, but this repository does not accept pull requests. There is no support and no roadmap. Fork it and make it yours."
          gh pr close "$PR" --repo "$REPO"
